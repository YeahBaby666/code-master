# ==========================================
# FIX: CONFIGURACIÓN HIKARICP PARA SUPABASE POOLER
# ==========================================
# Verifica que la conexión esté viva antes de ejecutar la transacción
spring.datasource.hikari.connection-test-query=SELECT 1
# Tiempo máximo de vida de una conexión en el pool (10 minutos) para evitar stale connections
spring.datasource.hikari.max-lifetime=600000
# Tiempo máximo que una conexión puede estar inactiva en el pool (2 minutos)
spring.datasource.hikari.idle-timeout=120000
# Mantiene la conexión viva con pequeños pings (cada 30 segundos)
spring.datasource.hikari.keepalive-time=30000
# Limita el número de conexiones simultáneas para no saturar el Tier gratuito de Supabase
spring.datasource.hikari.maximum-pool-size=15