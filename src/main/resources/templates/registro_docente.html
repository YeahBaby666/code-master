<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Docente</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md bg-gray-900 border border-amber-500 rounded-xl p-8 shadow-xl">
        <h1 class="text-3xl font-bold text-amber-400 mb-2">Registro de Profesor</h1>
        <p class="text-sm text-gray-400 mb-6">Acceso exclusivo por URL</p>

        <div th:if="${error}" class="bg-red-500/20 border border-red-500 text-red-300 px-3 py-2 rounded mb-4">
            <span th:text="${error}"></span>
        </div>
        <div th:if="${exito}" class="bg-green-500/20 border border-green-500 text-green-300 px-3 py-2 rounded mb-4">
            <span th:text="${exito}"></span>
        </div>

        <form th:action="@{/registro_docente}" method="post" class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-amber-200">Nombre</label>
                <input type="text" name="nombre" required class="w-full p-2 rounded bg-gray-800 border border-gray-700">
            </div>
            <div>
                <label class="block text-sm mb-1 text-amber-200">Correo</label>
                <input type="email" name="correo" required class="w-full p-2 rounded bg-gray-800 border border-gray-700">
            </div>
            <div>
                <label class="block text-sm mb-1 text-amber-200">Contraseña</label>
                <input type="password" name="contrasena" required class="w-full p-2 rounded bg-gray-800 border border-gray-700">
            </div>
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 py-2 rounded font-bold">Crear cuenta de profesor</button>
        </form>
    </div>
</body>
</html>
