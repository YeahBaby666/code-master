<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retos Públicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
    <div class="max-w-6xl mx-auto p-8">
        <h1 class="text-3xl font-bold text-cyan-400 mb-6">Retos públicos</h1>
        <div class="space-y-4">
            <div th:each="reto : ${retos}" class="bg-gray-900 border border-gray-700 rounded-xl p-5">
                <h2 class="text-xl font-bold" th:text="${reto.titulo}"></h2>
                <p class="text-gray-400 mt-2" th:text="${reto.descripcion}"></p>
                <a th:href="@{/retos/resolver/{codigoAcceso}(codigoAcceso=${reto.codigoAcceso})}" class="inline-block mt-3 bg-cyan-600 px-4 py-2 rounded">Resolver</a>
            </div>
        </div>
    </div>
</body>
</html>
