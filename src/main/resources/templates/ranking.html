<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Semanal - CodeMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-mono selection:bg-green-500 selection:text-white p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <div class="flex justify-between items-center border-b border-green-900 pb-4">
            <h1 class="text-3xl font-bold text-green-400 drop-shadow-[0_0_10px_rgba(74,222,128,0.5)] flex items-center gap-3">
                🏆 Tabla de Clasificación
            </h1>
            <a th:href="@{/index}" class="text-gray-400 hover:text-white transition-colors flex items-center gap-2">
                ← Volver al Hub
            </a>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-[0_0_20px_rgba(0,0,0,0.5)]">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-950 border-b border-green-900 text-green-500 text-sm tracking-wider uppercase">
                            <th class="p-4 font-bold">Posición</th>
                            <th class="p-4 font-bold">Alias / Estudiante</th>
                            <th class="p-4 font-bold text-center">Nodos Resueltos</th>
                            <th class="p-4 font-bold text-right">Puntaje Total</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-800">
                        <tr th:if="${#lists.isEmpty(rankings)}" class="bg-gray-900">
                            <td colspan="4" class="p-8 text-center text-gray-500">
                                Sin registros computados en el servidor en el periodo actual.
                            </td>
                        </tr>
                        
                        <tr th:each="r, iterStat : ${rankings}" 
                            class="bg-gray-900 hover:bg-gray-800 transition-colors group">
                            
                            <td class="p-4 text-center w-24">
                                <span th:if="${iterStat.count == 1}" class="bg-yellow-500/20 text-yellow-400 border border-yellow-500/50 px-3 py-1 rounded-lg font-bold shadow-[0_0_10px_rgba(234,179,8,0.4)]">1ST</span>
                                <span th:if="${iterStat.count == 2}" class="bg-gray-400/20 text-gray-300 border border-gray-400/50 px-3 py-1 rounded-lg font-bold">2ND</span>
                                <span th:if="${iterStat.count == 3}" class="bg-amber-700/20 text-amber-500 border border-amber-700/50 px-3 py-1 rounded-lg font-bold">3RD</span>
                                <span th:if="${iterStat.count > 3}" class="text-gray-500 font-bold" th:text="${'#' + iterStat.count}"></span>
                            </td>

                            <td class="p-4 font-bold text-white flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-green-500 group-hover:animate-ping"></span>
                                <span th:text="${r.estudiante.nombre}">Nombre</span>
                            </td>

                            <td class="p-4 text-center font-bold text-cyan-300">
                                <span th:text="${r.problemasResueltos}">0</span>
                            </td>
                            
                            <td class="p-4 text-right font-bold text-green-400 text-lg">
                                <span th:text="${r.puntosAcumulados}">0</span> XP
                            </td>

                            <td class="p-4 text-center">
                                <a th:href="@{/ranking/historial/{nombre}(nombre=${r.estudiante.nombre})}" 
                                   class="text-xs bg-gray-800 hover:bg-gray-700 text-cyan-300 border border-cyan-800 px-3 py-1.5 rounded transition shadow-[0_0_5px_rgba(8,145,178,0.2)]">
                                   Ver Historial
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
