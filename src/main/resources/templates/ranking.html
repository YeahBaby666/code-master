<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ranking Semanal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <h1 class="text-center mb-4">
        🏆 Ranking Semanal
    </h1>

    <table class="table table-dark table-striped">

        <thead>
        <tr>
            <th>Alumno</th>
            <th>Puntos</th>
            <th>Problemas Resueltos</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="r : ${rankings}">
            <td th:text="${r.estudiante.nombre}">
                Nombre
            </td>

            <td th:text="${r.puntosAcumulados}">
                0
            </td>

            <td th:text="${r.problemasResueltos}">
                0
            </td>
        </tr>
        </tbody>

    </table>

</div>

</body>
</html>
