<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Virtual</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
    <div class="max-w-6xl mx-auto p-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-cyan-400">Aula Virtual</h1>
            <button onclick="window.location.href='/index'" class="bg-gray-700 px-4 py-2 rounded">Salir</button>
        </div>

        <div th:if="${error}" class="bg-red-500/20 border border-red-500 p-3 rounded mb-4">[[${error}]]</div>
        <div th:if="${exito}" class="bg-green-500/20 border border-green-500 p-3 rounded mb-4">[[${exito}]]</div>

        <div class="grid md:grid-cols-2 gap-6">
            <button onclick="document.getElementById('modal-estudiante').classList.remove('hidden')" class="bg-cyan-900 border border-cyan-700 rounded-xl p-10 text-left hover:bg-cyan-800">
                <h2 class="text-2xl font-bold">Estudiante</h2>
                <p class="text-gray-400 mt-2">Ingresar con código y contraseña</p>
            </button>
            <button onclick="document.getElementById('modal-profesor').classList.remove('hidden')" class="bg-amber-900 border border-amber-700 rounded-xl p-10 text-left hover:bg-amber-800">
                <h2 class="text-2xl font-bold">Profesor</h2>
                <p class="text-gray-400 mt-2">Gestionar ejercicios y aulas</p>
            </button>
        </div>

        <div th:if="${rol} == 'profesor'" class="mt-10 bg-gray-900 border border-gray-800 rounded-xl p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-amber-300">Mis ejercicios</h2>
                <button onclick="document.getElementById('modal-crear-ejercicio').classList.remove('hidden')" class="bg-green-600 px-4 py-2 rounded">Crear ejercicio</button>
            </div>
            <div class="space-y-3">
                <div th:each="e : ${misEjercicios}" class="flex items-center justify-between bg-gray-800 rounded p-3">
                    <div>
                        <p class="font-bold" th:text="${e.titulo}"></p>
                        <p class="text-xs text-gray-400">Código: <span th:text="${e.codigoAcceso}"></span></p>
                    </div>
                    <div class="flex gap-2">
                        <a th:href="@{/aula/ejercicio/{id}(id=${e.id})}" class="bg-cyan-600 px-3 py-1 rounded text-sm">Ver</a>
                        <form th:action="@{/aula/ejercicio/{id}/habilitar(id=${e.id})}" th:method="post" th:if="${!e.habilitadoAula}">
                            <button class="bg-emerald-600 px-3 py-1 rounded text-sm">Habilitar aula</button>
                        </form>
                        <form th:action="@{/aula/ejercicio/{id}/deshabilitar(id=${e.id})}" th:method="post" th:if="${e.habilitadoAula}">
                            <button class="bg-red-600 px-3 py-1 rounded text-sm">Salir aula</button>
                        </form>
                        <form th:action="@{/aula/ejercicio/{id}/eliminar(id=${e.id})}" th:method="post">
                            <button class="bg-red-800 px-3 py-1 rounded text-sm">Eliminar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-estudiante" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-gray-900 border border-cyan-700 rounded-xl p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Acceso de estudiante</h3>
            <form th:action="@{/aula/entrar}" th:method="get" class="space-y-3">
                <input type="text" name="codigoAcceso" placeholder="Código de sala" class="w-full p-2 rounded bg-gray-800 border border-gray-700" required>
                <input type="password" name="password" placeholder="Contraseña de sala" class="w-full p-2 rounded bg-gray-800 border border-gray-700">
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="document.getElementById('modal-estudiante').classList.add('hidden')" class="px-4 py-2 rounded bg-gray-700">Cancelar</button>
                    <button type="submit" class="px-4 py-2 rounded bg-cyan-600">Entrar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-profesor" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-gray-900 border border-amber-700 rounded-xl p-6 w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Acceso de profesor</h3>
            <div th:if="${rol} == 'profesor'">
                <p class="text-sm text-gray-300 mb-4">Ya tienes acceso como profesor.</p>
                <button onclick="document.getElementById('modal-profesor').classList.add('hidden')" class="px-4 py-2 rounded bg-amber-600">Cerrar</button>
            </div>
            <div th:unless="${rol} == 'profesor'">
                <p class="text-sm text-gray-300 mb-4">No tienes permisos de profesor.</p>
                <button onclick="document.getElementById('modal-profesor').classList.add('hidden')" class="px-4 py-2 rounded bg-gray-700">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="modal-crear-ejercicio" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-gray-900 border border-green-700 rounded-xl p-6 w-full max-w-lg">
            <h3 class="text-xl font-bold mb-4">Crear ejercicio</h3>
            <form th:action="@{/aula/ejercicio/crear}" th:method="post" class="space-y-3">
                <input type="text" name="titulo" placeholder="Título del ejercicio" class="w-full p-2 rounded bg-gray-800 border border-gray-700" required>
                <textarea name="descripcion" placeholder="Descripción" class="w-full p-2 rounded bg-gray-800 border border-gray-700" required></textarea>
                <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" name="publico" value="true">
                    Publico (aparece en retos)
                </label>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="document.getElementById('modal-crear-ejercicio').classList.add('hidden')" class="px-4 py-2 rounded bg-gray-700">Cancelar</button>
                    <button type="submit" class="px-4 py-2 rounded bg-green-600">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
