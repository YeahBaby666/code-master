<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMaster - Entorno del Estudiante</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: monospace;
        }

        .CodeMirror {
            height: auto;
            border-radius: 0.5rem;
            font-family: monospace;
            font-size: 14px;
        }

        .consola {
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            /* Obliga al HTML a respetar los saltos de línea \n */
            word-break: break-word;
            /* Evita que textos larguísimos se salgan de la caja negra */
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        .badge-resuelto {
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(34, 197, 94, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }
    </style>
</head>

<body class="p-8">

    <div class="max-w-5xl mx-auto space-y-8">
        <header class="bg-gray-900 border border-gray-800 rounded-xl p-6 shadow-2xl relative">
            <div class="flex justify-between items-center gap-4 flex-wrap">
                <div>
                    <h1 class="text-3xl font-bold text-cyan-400">👨‍💻 <span class="text-white"
                            th:text="${tituloReto}">RETO</span></h1>

                    <p class="text-gray-400 mt-2 text-sm" th:if="${rol == 'profesor'}">Ruta del Socket (Compartir con
                        alumnos):
                        <span class="text-amber-400 font-mono bg-gray-800 px-2 py-1 rounded select-all"
                            th:text="${rutaSocket}"></span>
                    </p>

                    <p class="text-gray-400 mt-2">Conexión al Motor: <span id="status" class="text-yellow-400">Iniciando
                            entorno aislado...</span></p>
                    <p class="text-gray-400 mt-1 text-sm">WebSocket: <span id="socket-status"
                            class="text-yellow-300">desconectado</span></p>
                </div>

                <div class="flex items-center gap-2 flex-wrap">
                    <div id="controles-superior" class="flex gap-2">

                        <form th:if="${rol == 'estudiante' && !isLive}"
                            th:action="@{/ejercicio/{id}/reset(id=${ejercicioId})}" method="post">
                            <button type="submit"
                                onclick="return confirm('¿Resetear a su estado original? Extraerá la última version guardada por el profesor.')"
                                class="bg-red-900/80 hover:bg-red-800 text-red-200 border border-red-700 px-3 py-2 rounded-lg font-bold transition text-sm">
                                ↺ Resetear
                            </button>
                        </form>

                        <button id="btn-guardar" onclick="ConexionOffline.guardarProgreso()"
                            th:if="${rol == 'profesor' || !isLive}"
                            class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg font-bold transition text-sm flex items-center gap-2">
                            💾 <span id="texto-guardar">Guardar Progreso</span>
                        </button>
                    </div>

                    <button id="btn-agregar-celda"
                        class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-lg font-bold transition"
                        th:classappend="${rol != 'profesor'} ? 'hidden' : ''">+ Añadir Celda</button>

                    <button onclick="MotorEjecucion.ejecutarSecuenciaGlobal()"
                        class="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-lg font-bold shadow-[0_0_15px_rgba(34,197,94,0.3)] transition">
                        ▶ Ejecutar Todo
                    </button>
                </div>
            </div>
        </header>

        <div id="contenedor-celdas" class="space-y-8"></div>
    </div>

    <div id="modal-editor" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50">
        <div class="bg-gray-900 border border-gray-700 rounded-xl p-6 w-full max-w-2xl shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl text-cyan-300 font-bold">Editar variables de la celda</h3>
                <button onclick="InterfazUI.cerrarModal()" class="text-gray-400 hover:text-white">✕</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <label class="text-sm text-gray-300">Secuencia<input id="modal-seq" type="number"
                        class="w-full mt-1 rounded bg-gray-800 border border-gray-700 p-2"></label>
                <label class="text-sm text-gray-300">Título<input id="modal-titulo" type="text"
                        class="w-full mt-1 rounded bg-gray-800 border border-gray-700 p-2"></label>
                <label class="text-sm text-gray-300">Resolver<input id="modal-resolver" type="checkbox"
                        class="ml-2"></label>
                <label class="text-sm text-gray-300">Respuesta esperada (Usa el print especial:
                    api.submit(resultado))<input id="modal-respuesta" type="text"
                        class="w-full mt-1 rounded bg-gray-800 border border-gray-700 p-2"></label>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="InterfazUI.cerrarModal()"
                    class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600">Cancelar</button>
                <button onclick="InterfazUI.guardarModal()"
                    class="px-4 py-2 rounded bg-cyan-600 hover:bg-cyan-500">Guardar</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // ==========================================
        // 1. ESTADO GLOBAL
        // ==========================================
        const rawJsonString = /*[[${celdasJson}]]*/ '[]';
        let celdasBd = [];

        try {
            if (rawJsonString && typeof rawJsonString === 'string' && rawJsonString.trim() !== '') {
                celdasBd = JSON.parse(rawJsonString);
            } else if (rawJsonString && typeof rawJsonString === 'object') {
                celdasBd = rawJsonString;
            } else {
                celdasBd = [{ id: "c_1", seq: 1, titulo: "Paso 1: Inicialización", codigo: "# Escribe tu código aquí\n", resolver: false, respuesta_esperada: "", resuelto: false }];
            }
        } catch (e) {
            celdasBd = [{ id: "c_1", seq: 1, titulo: "Paso 1", codigo: "# Error de carga\n", resolver: false, respuesta_esperada: "", resuelto: false }];
        }

        const appState = {
            id_ejercicio: /*[[${ejercicioId}]]*/ '',
            cursoId: "curso-demo",
            profesorId: /*[[${profesorId}]]*/ '',
            modo: /*[[${rol}]]*/ 'estudiante',
            celdaActualId: celdasBd.length > 0 ? celdasBd[0].id : null,
            modalCeldaId: null,
            celdas: celdasBd,
            editores: {},
            outputsTemporales: {},
            // NUEVO: Almacena exclusivamente los valores enviados por api.submit()
            respuestasEnviadas: {}
        };

        const isLive = /*[[${isLive != null ? isLive : false}]]*/ false;
        const livePass = /*[[${livePass != null ? livePass : ''}]]*/ '';
        const socketEndpoint = '/ws-ejercicios';
        let stompClient = null;

        // ==========================================
        // 2. SOCKET BRIDGE
        // ==========================================
        const SocketBridge = {
            conectar: (profesorId, ejercicioId, password) => {
                const socket = new SockJS('/ws-ejercicios');
                stompClient = Stomp.over(socket);
                const headersSeguridad = { 'pass': password || '' };

                stompClient.connect(headersSeguridad, function () {
                    const s = document.getElementById('socket-status');
                    if (s) { s.textContent = 'conectado'; s.className = 'text-green-400'; }
                    const destination = `/topic/room/${profesorId}/${ejercicioId}`;

                    stompClient.subscribe(destination, function (message) {
                        const command = JSON.parse(message.body);
                        GestorEstado.ejecutarAction(command.payload);
                    }, headersSeguridad);

                    if (appState.modo === 'estudiante') {
                        setTimeout(() => { InterfazUI._emitirCambio('global', 'request_sync', null); }, 500);
                    }

                }, function (error) {
                    const s = document.getElementById('socket-status');
                    if (s) { s.textContent = 'Error: Sala bloqueada'; s.className = 'text-red-400'; }
                });
            },
            enviarComando: (profesorId, ejercicioId, commandMessage) => {
                if (stompClient && stompClient.connected) {
                    stompClient.send(`/app/teacher/${profesorId}/${ejercicioId}/command`, {}, JSON.stringify(commandMessage));
                }
            }
        };

        // ==========================================
        // 3. GESTOR DE ESTADO
        // ==========================================
        const GestorEstado = {
            modificarSeq: (id, valor) => { const c = appState.celdas.find(c => c.id === id); if (c) { c.seq = Number(valor) || 0; InterfazUI.renderizarTodas(); } },
            modificarResolver: (id, valor) => { const c = appState.celdas.find(c => c.id === id); if (c) { c.resolver = (valor === 'true' || valor === true); InterfazUI.renderizarTodas(); } },
            modificarRespuestaEsperada: (id, valor) => { const c = appState.celdas.find(c => c.id === id); if (c) { c.respuesta_esperada = valor || ''; InterfazUI.renderizarTodas(); } },
            modificarTitulo: (id, valor) => { const c = appState.celdas.find(c => c.id === id); if (c) { c.titulo = valor || ''; InterfazUI.renderizarTodas(); } },
            modificarCodigo: (id, valor) => {
                const c = appState.celdas.find(c => c.id === id);
                if (!c) return;
                c.codigo = valor || '';
                if (appState.editores[id] && appState.editores[id].getValue() !== valor) {
                    appState.editores[id].setValue(valor || '');
                }
            },
            crearCelda: (nuevaCelda) => {
                if (!nuevaCelda.id) nuevaCelda.id = 'c_' + Date.now();
                if (!nuevaCelda.seq) nuevaCelda.seq = appState.celdas.length + 1;
                nuevaCelda.resolver = !!nuevaCelda.resolver;
                nuevaCelda.respuesta_esperada = nuevaCelda.respuesta_esperada || '';
                nuevaCelda.resuelto = false;
                appState.celdas.push(nuevaCelda);
                appState.celdaActualId = nuevaCelda.id;
                InterfazUI.renderizarTodas();
            },
            eliminarCelda: (id) => {
                if (!id || appState.celdas.length <= 1) return;
                appState.celdas = appState.celdas.filter(c => c.id !== id);
                if (appState.celdaActualId === id) appState.celdaActualId = appState.celdas[0]?.id || null;
                delete appState.editores[id]; delete appState.outputsTemporales[id];
                InterfazUI.renderizarTodas();
            },
            sincronizarYGuardarCelda: (id) => {
                const celda = appState.celdas.find(c => c.id === id);
                if (celda) {
                    celda.codigo = appState.editores[id] ? appState.editores[id].getValue() : celda.codigo;
                    InterfazUI._emitirCambio(id, 'sync_celda', celda);
                    ConexionOffline.guardarProgreso();
                }
            },
            procesarComandoVariable: async (id_celda, variable, valor) => {
                switch (variable) {
                    case 'seq': GestorEstado.modificarSeq(id_celda, valor); break;
                    case 'resolver': GestorEstado.modificarResolver(id_celda, valor); break;
                    case 'respuesta_esperada': GestorEstado.modificarRespuestaEsperada(id_celda, valor); break;
                    case 'titulo': GestorEstado.modificarTitulo(id_celda, valor); break;
                    case 'codigo': GestorEstado.modificarCodigo(id_celda, valor); break;
                    case 'exec': await MotorEjecucion.ejecutarCeldaAsync(id_celda); break;
                    case 'execAll': await MotorEjecucion.ejecutarSecuenciaGlobal(); break;
                    case 'crear_celda': GestorEstado.crearCelda(valor); break;
                    case 'eliminar_celda': GestorEstado.eliminarCelda(id_celda); break;
                    case 'sync_celda':
                        const idx = appState.celdas.findIndex(c => c.id === id_celda);
                        if (idx !== -1) appState.celdas[idx] = valor;
                        else appState.celdas.push(valor);
                        InterfazUI.renderizarTodas();
                        break;
                    case 'sync_all':
                        appState.celdas = valor;
                        InterfazUI.renderizarTodas();
                        break;
                    case 'cambiar_foco':
                        appState.celdaActualId = id_celda;
                        InterfazUI.renderizarTodas();
                        setTimeout(() => {
                            const elemento = document.getElementById(`titulo-${id_celda}`);
                            if (elemento) elemento.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }, 100);
                        break;
                    case 'request_sync':
                        if (appState.modo === 'profesor') {
                            InterfazUI._emitirCambio('global', 'sync_all', appState.celdas);
                        }
                        break;
                }
            },
            ejecutarAction: async (payload) => {
                if (!payload) return;
                const { id_celda, variable, valor } = payload;
                await GestorEstado.procesarComandoVariable(id_celda, variable, valor);
            }
        };

        // ==========================================
        // 4. MOTOR DE EJECUCIÓN (Reactivo & Validador)
        // ==========================================
        const MotorEjecucion = {
            worker: null,
            resolverPromesaActual: null,
            inicializar: () => {
                const workerCodeLines = [
                    'importScripts("https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js");',
                    'let pyodide = null;',
                    'let ready = false;',
                    'self.emitirStdout = (cellId, text) => postMessage({ type: "stdout", cellId: cellId, text: text });',

                    // NUEVO: Emitir Submit para la validación limpia
                    'self.emitirSubmit = (cellId, text) => postMessage({ type: "submit", cellId: cellId, text: text });',

                    'async function init() {',
                    '    try {',
                    '        pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.25.0/full/" });',
                    '        await pyodide.runPythonAsync(`',
                    'import sys, js',
                    'class __CodeMasterAPI:',
                    '    _bus = {}',
                    '    _listeners = {}',
                    '    def __init__(self, cell_id):',
                    '        self.cell_id = cell_id',
                    '    def send(self, canal, datos):',
                    '        # FILTRO DE SEGURIDAD: Solo enviamos si hay listeners activos',
                    '        if canal in self.__class__._listeners and len(self.__class__._listeners[canal]) > 0:',
                    '            self.__class__._bus[canal] = datos',
                    '            for cid, cb in self.__class__._listeners[canal]:',
                    '                class TargetConsole:',
                    '                    def write(self, text):',
                    '                        if text: js.emitirStdout(cid, text)',
                    '                    def flush(self): pass',
                    '                old_out = sys.stdout',
                    '                sys.stdout = TargetConsole()',
                    '                try:',
                    '                    cb(datos)',
                    '                except Exception as e:',
                    '                    print(f"[Error en inicializar]: {str(e)}")',
                    '                finally:',
                    '                    sys.stdout = old_out',
                    '        else:',
                    '            # Si nadie escucha, el mensaje muere aquí y NO se guarda en _bus',
                    '            print(f"⚠️ Aviso: Canal \'{canal}\' sin receptores activos. Mensaje descartado.")',
                    '    def listen(self, canal, callback=None):',
                    '        if callback is None:',
                    '            if canal not in self.__class__._bus:',
                    '                raise Exception(f"Canal vacío: \'{canal}\'. Usa api.listen(\'{canal}\', mi_funcion) para escuchar.")',
                    '            return self.__class__._bus[canal]',
                    '        else:',
                    '            if canal not in self.__class__._listeners:',
                    '                self.__class__._listeners[canal] = []',
                    '            self.__class__._listeners[canal] = [lst for lst in self.__class__._listeners[canal] if lst[0] != self.cell_id]',
                    '            self.__class__._listeners[canal].append((self.cell_id, callback))',
                    '            if canal in self.__class__._bus:',
                    '                self.send(canal, self.__class__._bus[canal])',

                    // NUEVA FUNCIÓN NATIVA: api.submit()
                    '    def submit(self, valor):',
                    '        val_str = str(valor)',
                    '        js.emitirSubmit(self.cell_id, val_str)',
                    '        `);',

                    '        ready = true;',
                    '        postMessage({ type: "status", msg: "Listo" });',
                    '    } catch (e) { postMessage({ type: "init_error", msg: e.message }); }',
                    '}',
                    'init();',
                    'self.onmessage = async (e) => {',
                    '    if (!ready) { postMessage({ type: "error", cellId: e.data.cellId, text: "⚙️ Descargando Python..." }); return; }',
                    '    const { cellId, code } = e.data;',
                    '    pyodide.globals.set("codigo_alumno", code); pyodide.globals.set("cell_id_actual", cellId);',
                    '    const pythonWrapper = [',
                    '        "import sys, js",',
                    '        "class CellConsole:",',
                    '        "    def write(self, text):",',
                    '        "        if text: js.emitirStdout(cell_id_actual, text)",',
                    '        "    def flush(self): pass",',
                    '        "sys.stdout = CellConsole()",',
                    '        "sys.stderr = sys.stdout",',
                    '        "api_instancia = __CodeMasterAPI(cell_id_actual)",',
                    '        "__CodeMasterAPI._bus.clear()",',
                    '        "try:",',
                    '        "    exec(codigo_alumno, {\\"print\\": print, \\"api\\": api_instancia})",',
                    '        "except Exception as e:",',
                    '        "    print(chr(10) + \\"[Error]: \\" + str(e))"',
                    '    ].join(String.fromCharCode(10));',
                    '    try { await pyodide.runPythonAsync(pythonWrapper); postMessage({ type: "done", cellId: cellId }); } catch (err) { postMessage({ type: "error", cellId: cellId, text: err.message }); }',
                    '};'
                ];

                const workerCode = workerCodeLines.join(String.fromCharCode(10));
                MotorEjecucion.worker = new Worker(URL.createObjectURL(new Blob([workerCode], { type: 'application/javascript' })));

                MotorEjecucion.worker.onerror = (err) => {
                    const s = document.getElementById('status');
                    if (s) { s.textContent = 'Falla del Hilo Secundario'; s.className = 'text-red-500 font-bold'; }
                };

                MotorEjecucion.worker.onmessage = (e) => {
                    const data = e.data;
                    const s = document.getElementById('status');
                    if (data.type === 'status') {
                        if (s) { s.textContent = 'Motor Pyodide Listo'; s.className = 'text-green-400'; }
                    } else if (data.type === 'init_error') {
                        if (s) { s.textContent = 'Fallo de Red: Pyodide bloqueado'; s.className = 'text-red-500 font-bold'; }
                    } else if (data.type === 'stdout') {
                        if (!appState.outputsTemporales[data.cellId]) appState.outputsTemporales[data.cellId] = '';
                        appState.outputsTemporales[data.cellId] += data.text;
                        InterfazUI.imprimirEnConsola(data.cellId, data.text);

                        // NUEVO: Capturador de Submit que actualiza UI en tiempo real
                    } else if (data.type === 'submit') {
                        appState.respuestasEnviadas[data.cellId] = data.text;
                        InterfazUI.imprimirEnConsola(data.cellId, `\n[📦 Respuesta Entregada]: ${data.text}\n`, 'text-fuchsia-400 font-bold bg-fuchsia-900/30 px-2 py-1 rounded inline-block my-1');

                        // Esperamos al siguiente frame para validar, asegurando que la UI esté lista
                        requestAnimationFrame(async () => {
                            await InterfazUI.validarCelda(data.cellId);
                        });

                    } else if (data.type === 'done' || data.type === 'error') {
                        if (data.type === 'error') {
                            InterfazUI.imprimirEnConsola(data.cellId, '\n' + data.text, 'text-red-500');
                        }

                        
                    }
                };
            },

            ejecutarCeldaAsync: async (id) => {
                const celda = appState.celdas.find(c => c.id === id);
                if (!celda) return;

                const codigo = (appState.editores[id] && appState.editores[id].getValue()) || celda.codigo;
                celda.codigo = codigo;

                const consola = document.getElementById(`consola-${id}`);
                if (consola) consola.innerHTML = '<div class="text-gray-600 mb-1">--- Salida ---</div>';

                // Reiniciamos memorias de validación de la celda a ejecutar
                appState.outputsTemporales[id] = '';
                appState.respuestasEnviadas[id] = null;

                if (!isLive) {
                    if (typeof ConexionOffline !== 'undefined') ConexionOffline.guardarProgreso();
                }

                return new Promise((resolve) => {
                    MotorEjecucion.resolverPromesaActual = resolve;
                    MotorEjecucion.worker.postMessage({ cellId: id, code: codigo });
                });
            },

            ejecutarSecuenciaGlobal: async () => {
                const celdasOrdenadas = [...appState.celdas].sort((a, b) => a.seq - b.seq);
                for (const celda of celdasOrdenadas) {
                    await MotorEjecucion.ejecutarCeldaAsync(celda.id);
                }
            }
        };

        // ==========================================
        // 5. INTERFAZ UI
        // ==========================================
        const InterfazUI = {
            _emitirCambio: (id_celda, variable, valor) => {
                if (stompClient && stompClient.connected) {
                    if (appState.modo === 'profesor' || (appState.modo === 'estudiante' && variable === 'request_sync')) {
                        const dtoJSON = { payload: { id_celda: id_celda, variable: variable, valor: valor } };
                        stompClient.send(`/app/teacher/${appState.profesorId}/${appState.id_ejercicio}/command`, {}, JSON.stringify(dtoJSON));
                    }
                }
            },
            abrirModal: (id) => {
                const celda = appState.celdas.find(c => c.id === id);
                if (!celda) return;
                appState.modalCeldaId = id;
                document.getElementById('modal-seq').value = celda.seq || 0;
                document.getElementById('modal-titulo').value = celda.titulo || '';
                document.getElementById('modal-resolver').checked = !!celda.resolver;
                document.getElementById('modal-respuesta').value = celda.respuesta_esperada || '';
                document.getElementById('modal-editor').classList.remove('hidden');
                document.getElementById('modal-editor').classList.add('flex');
            },
            cerrarModal: () => {
                document.getElementById('modal-editor').classList.add('hidden');
                document.getElementById('modal-editor').classList.remove('flex');
                appState.modalCeldaId = null;
            },
            guardarModal: () => {
                const id = appState.modalCeldaId;
                if (!id) return;
                const celda = appState.celdas.find(c => c.id === id);
                if (!celda) return;

                const nuevaSeq = Number(document.getElementById('modal-seq').value) || celda.seq;
                const nuevoTitulo = document.getElementById('modal-titulo').value;
                const nuevoResolver = document.getElementById('modal-resolver').checked;
                const nuevaRespuesta = document.getElementById('modal-respuesta').value;

                if (celda.seq !== nuevaSeq) InterfazUI._emitirCambio(id, 'seq', nuevaSeq);
                if (celda.titulo !== nuevoTitulo) InterfazUI._emitirCambio(id, 'titulo', nuevoTitulo);
                if (celda.resolver !== nuevoResolver) InterfazUI._emitirCambio(id, 'resolver', nuevoResolver);
                if (celda.respuesta_esperada !== nuevaRespuesta) InterfazUI._emitirCambio(id, 'respuesta_esperada', nuevaRespuesta);

                celda.seq = nuevaSeq;
                celda.titulo = nuevoTitulo;
                celda.resolver = nuevoResolver;
                celda.respuesta_esperada = nuevaRespuesta;

                InterfazUI.cerrarModal();
                InterfazUI.renderizarTodas();
            },
            sincronizarEditoresAlEstado: () => {
                appState.celdas.forEach(celda => {
                    if (appState.editores[celda.id]) {
                        const valorActual = appState.editores[celda.id].getValue();
                        if (valorActual !== celda.codigo) {
                            appState.editores[celda.id].setValue(celda.codigo || '');
                        }
                    }
                });
            },
            renderizarTodas: () => {
                InterfazUI.sincronizarEditoresAlEstado();
                const contenedor = document.getElementById('contenedor-celdas');
                if (!contenedor) return;

                contenedor.innerHTML = '';
                appState.editores = {};

                const btnAg = document.getElementById('btn-agregar-celda');
                if (btnAg) btnAg.classList.toggle('hidden', appState.modo !== 'profesor');

                appState.celdas.sort((a, b) => a.seq - b.seq).forEach(celda => {
                    let badge = '';
                    if (celda.resolver) {
                        badge = celda.resuelto
                            ? '<span class="bg-green-600 px-3 py-1 rounded-full text-xs badge-resuelto font-bold shadow-[0_0_10px_rgba(34,197,94,0.5)]">✓ SUPERADO</span>'
                            : '<span class="bg-gray-700 px-3 py-1 rounded-full text-xs font-bold text-gray-300 border border-gray-600">Pendiente</span>';
                    }

                    const esCeldaActual = appState.celdaActualId === celda.id;
                    const codigoReadOnly = false;

                    const controlesProfesor = appState.modo === 'profesor'
                        ? `
                            <div class="flex items-center gap-2">
                                <button onclick="GestorEstado.sincronizarYGuardarCelda('${celda.id}')" class="bg-blue-700 hover:bg-blue-600 px-3 py-1 rounded text-sm text-blue-100" title="Guardar Celda y Sincronizar">💾</button>
                                <button onclick="InterfazUI.abrirModal('${celda.id}')" class="bg-amber-700 hover:bg-amber-600 px-3 py-1 rounded text-sm text-amber-100" title="Editar Variables">✎</button>
                                <button onclick="GestorEstado.eliminarCelda('${celda.id}'); InterfazUI._emitirCambio('${celda.id}', 'eliminar_celda', null);" class="bg-red-700 hover:bg-red-600 px-3 py-1 rounded text-sm text-red-100" title="Eliminar">🗑</button>
                                <label class="flex items-center gap-1 text-xs text-gray-300 ml-2 cursor-pointer" title="Fuerza la pantalla de los estudiantes hacia esta celda">
                                    <input type="checkbox" ${esCeldaActual ? 'checked' : ''} onclick="appState.celdaActualId='${celda.id}'; InterfazUI._emitirCambio('${celda.id}', 'cambiar_foco', null); InterfazUI.renderizarTodas();">
                                    Foco
                                </label>
                            </div>
                        ` : '';

                    const html = `
                        <div class="bg-gray-900 border ${celda.resuelto ? 'border-green-800' : 'border-gray-700'} rounded-lg p-5 shadow-lg relative overflow-hidden">
                            <div class="flex justify-between items-center mb-4 gap-3 flex-wrap">
                                <div class="flex items-center gap-2 flex-wrap">
                                    <h3 class="text-lg text-cyan-300 font-bold" id="titulo-${celda.id}">
                                        <span class="text-gray-500 mr-2">[${celda.seq}]</span>${celda.titulo} ${badge}
                                    </h3>
                                    ${controlesProfesor}
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="MotorEjecucion.ejecutarCeldaAsync('${celda.id}'); InterfazUI._emitirCambio('${celda.id}', 'exec', null);" class="bg-cyan-900 hover:bg-cyan-700 border border-cyan-700 px-4 py-1.5 rounded text-sm text-cyan-100 transition">
                                        Ejecutar Bloque
                                    </button>
                                </div>
                            </div>
                            <div class="rounded-lg overflow-hidden border border-gray-800 shadow-inner">
                                <textarea id="editor-${celda.id}" ${codigoReadOnly ? 'readonly' : ''}>${celda.codigo}</textarea>
                            </div>
                            <div class="bg-black text-gray-300 p-3 mt-3 rounded border border-gray-800 consola text-sm" id="consola-${celda.id}"></div>
                        </div>
                    `;
                    contenedor.insertAdjacentHTML('beforeend', html);

                    const editor = CodeMirror.fromTextArea(document.getElementById(`editor-${celda.id}`), {
                        mode: 'python',
                        theme: 'dracula',
                        lineNumbers: true,
                        indentUnit: 4,
                        tabSize: 4,
                        indentWithTabs: false, // Prohíbe el uso de caracteres \t
                        extraKeys: {
                            // Intercepta la tecla Tab y la convierte en 4 espacios exactos
                            "Tab": (cm) => {
                                if (cm.somethingSelected()) {
                                    cm.indentSelection("add");
                                } else {
                                    cm.replaceSelection("    ", "end");
                                }
                            }
                        },
                        readOnly: codigoReadOnly ? 'nocursor' : false
                    });
                    appState.editores[celda.id] = editor;

                    editor.on('change', (cm) => {
                        const nuevoValor = cm.getValue();
                        if (nuevoValor !== celda.codigo) {
                            GestorEstado.modificarCodigo(celda.id, nuevoValor);
                            InterfazUI._emitirCambio(celda.id, 'codigo', nuevoValor);
                        }
                    });
                });
            },
            imprimirEnConsola: (id, texto, clasesExtra = '') => {
                const consola = document.getElementById(`consola-${id}`);
                if (!consola) return;
                const span = document.createElement('span');
                span.textContent = texto;
                if (clasesExtra) span.className = clasesExtra;
                consola.appendChild(span);
                consola.scrollTop = consola.scrollHeight;
            },

            // NUEVO: Validación exclusiva con api.submit()
            validarCelda: async (id) => {
                const celda = appState.celdas.find(c => c.id === id);
                if (!celda || !celda.resolver) return;

                // Si ya estaba resuelto, no hacemos nada para evitar duplicados
                if (celda.resuelto) return;

                const respuestaEnviada = appState.respuestasEnviadas[id];
                const outputEsperado = (celda.respuesta_esperada || '').trim();

                if (respuestaEnviada === undefined || respuestaEnviada === null) {
                    return; // No mostramos error si el alumno aún no envía nada
                }

                const valorGenerado = respuestaEnviada.trim();

                if (valorGenerado === outputEsperado) {
                    // 1. CAMBIAR ESTADO PRIMERO
                    celda.resuelto = true;
                    
                    // 2. RENDERIZAR PARA MOSTRAR "SUPERADO"
                    InterfazUI.renderizarTodas();
                    
                    // 3. PERSISTIR AL SERVIDOR (Esto actualiza el Ranking)
                    await ConexionOffline.guardarProgreso();
                    
                    InterfazUI.imprimirEnConsola(id, '\n🎉 ¡FELICIDADES! Respuesta correcta. Progreso guardado.\n', 'text-green-400 font-bold');
                } else {
                    celda.resuelto = false;
                    InterfazUI.imprimirEnConsola(id, `\n[Sistema]: Salida incorrecta. Se esperaba '${outputEsperado}', pero entregaste '${valorGenerado}'.\n`, 'text-red-400 font-bold block');
                }
            }
        };

        // ==========================================
        // 6. PERSISTENCIA OFFLINE
        // ==========================================
        const ConexionOffline = {
            guardarProgreso: async () => {
                // Si estamos en modo estudiante y en vivo, el profesor controla el flujo
                if (appState.modo === 'estudiante' && isLive) return;

                // Sincronizar editores para asegurar que el último código esté en el objeto
                InterfazUI.sincronizarEditoresAlEstado();

                // Verificamos el estado real antes de enviar
                const celdasRequeridas = appState.celdas.filter(c => c.resolver === true);
                const estaCompletado = celdasRequeridas.length > 0 && celdasRequeridas.every(c => c.resuelto === true);

                try {
                    const response = await fetch(`/ejercicio/${appState.id_ejercicio}/guardar?completado=${estaCompletado}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(appState.celdas)
                    });

                    if (!response.ok) throw new Error("Fallo en la red");
                    
                    // Solo si el servidor responde OK, confirmamos el guardado
                    console.log("Servidor actualizado, ranking al día.");
                } catch (error) {
                    console.error("[Persistencia] Error:", error);
                }
            }
        };

        // ==========================================
        // 7. ARRANQUE
        // ==========================================
        const btnAddCelda = document.getElementById('btn-agregar-celda');
        if (btnAddCelda) btnAddCelda.addEventListener('click', () => { GestorEstado.crearCelda({}); });

        InterfazUI.renderizarTodas();
        MotorEjecucion.inicializar();

        if (isLive) {
            const s = document.getElementById('status');
            if (s) s.textContent = 'Conectando a Aula en Vivo...';
            SocketBridge.conectar(appState.profesorId, appState.id_ejercicio, livePass);
        }
    </script>
</body>

</html>
